pool: Station-testing-pool

trigger:
- main
- feature/*

parameters:
- name: environment
  displayName: which environment
  type: string
  values:
  - dev
  - prood

stages:
  - stage: validate
    displayName: validate ka stage
    jobs:
      - job: validate
        displayName: validate ki job
        steps:
        - task: TerraformTask@5
          displayName: validate ka init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/${{ parameters.environment }}'
            backendServiceArm: 'Station-ASC'
            backendAzureRmResourceGroupName: 'admin_rg'
            backendAzureRmStorageAccountName: 'pipelinetfstate'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'prood-state'
        - task: TerraformTask@5
          displayName: validate task
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/${{ parameters.environment }}'
            
  - stage: plan
    displayName: plan stage
    jobs:
      - job: plan
        displayName: plan ki job
        steps:
        - task: TerraformTask@5
          displayName: plan ka init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/${{ parameters.environment }}'
            backendServiceArm: 'Station-ASC'
            backendAzureRmResourceGroupName: 'admin_rg'
            backendAzureRmStorageAccountName: 'pipelinetfstate'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'prood-state'
        - task: TerraformTask@5
          displayName: plan task
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/${{ parameters.environment }}'
            environmentServiceNameAzureRM: 'Station-ASC'

  - stage: approval
    displayName: approval ki stage
    jobs:
    - job: approval
      displayName: approval ki stage
      pool: server
      steps:
      - task: ManualValidation@1
        inputs:
          notifyUsers: 'abd@gmail.com'

  - stage: apply
    displayName: apply ki stage
    jobs:
      - job: apply
        displayName: apply ki job
        steps:
        - task: TerraformTask@5
          displayName: apply ka init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/${{ parameters.environment }}'
            backendServiceArm: 'Station-ASC'
            backendAzureRmResourceGroupName: 'admin_rg'
            backendAzureRmStorageAccountName: 'pipelinetfstate'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'prood-state'
        - task: TerraformTask@5
          displayName: apply task
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/${{ parameters.environment }}'
            environmentServiceNameAzureRM: 'Station-ASC'